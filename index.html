<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squizzotti's Diet</title>
<meta name="description" content="Piano pasti della settimana e lista della spesa di Matteo e Anna.">
<meta name="theme-color" content="#FAB80C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Squizzotti's">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body class="signed-out">
<header class="band">
  <div class="wrap top">
    <div class="titlebox">
      <div class="brand">
        <svg class="logo" viewBox="-2 -2 159.84 141.16" aria-hidden="true"><path class="heart" d="M78,96 C52,78 28,60 28,36 C28,18 41,4 58,4 C68,4 75,10 78,18 C81,10 88,4 98,4 C115,4 128,18 128,36 C128,60 104,78 78,96 Z"/><path class="core" d="M78,64.64 C68.64,58.16 60,51.68 60,43.04 C60,36.56 64.68,31.52 70.8,31.52 C74.4,31.52 76.92,33.68 78,36.56 C79.08,33.68 81.6,31.52 85.2,31.52 C91.32,31.52 96,36.56 96,43.04 C96,51.68 87.36,58.16 78,64.64 Z"/><g class="bone"><circle cx="25.04" cy="112.12" r="25.03"/><circle cx="130.81" cy="112.12" r="25.03"/><path d="m41.73,130.76s13.35-13.93,36.19-13.93,36.18,13.93,36.18,13.93v-37.29s-14.42,14.29-36.18,14.29c-22.83,0-36.19-14.3-36.19-14.3v37.3Z"/></g></svg>
        <h1>Squizzotti's Diet</h1>
      </div>
    </div>
  </div>
</header>

<section class="wrap login" id="login" hidden>
  <form class="card login-card" id="login-form" autocomplete="on">
    <h3>Accedi</h3>
    <p class="meta">Solo per Matteo e Anna. Usa l'email e la password del vostro account.</p>
    <label class="field"><span>Email</span><input type="email" id="login-email" name="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input type="password" id="login-pw" name="password" autocomplete="current-password" required></label>
    <p class="warnline" id="login-err" hidden></p>
    <button class="btn" type="submit" id="login-btn">Entra</button>
  </form>
</section>

<div class="wrap app" id="app" hidden>
  <div class="weekbar">
    <div class="weeknav">
      <button class="iconbtn" data-act="week-prev" aria-label="Settimana precedente">‹</button>
      <div class="weeklabel" id="weeklabel"></div>
      <button class="iconbtn" data-act="week-next" aria-label="Settimana successiva">›</button>
    </div>
    <span class="status" id="status" hidden><i></i><span></span></span>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Scelta del pasto"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="dieta-pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
