<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squizzotti's Diet</title>
<meta name="description" content="Piano pasti della settimana e lista della spesa di Matteo e Anna.">
<meta name="theme-color" content="#FAB80C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Squizzotti's">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body class="signed-out">
<header class="band">
  <div class="wrap top">
    <div class="titlebox">
      <div class="brand">
        <svg class="logo" viewBox="-2 -2 159.84 141.16" aria-hidden="true"><path class="ring" d="m95.43,3.34c-24.5-9.67-52.2,2.36-61.86,26.86-9.67,24.5,2.36,52.2,26.86,61.86,24.5,9.67,52.2-2.36,61.86-26.86,9.67-24.5-2.36-52.2-26.86-61.86Zm3.5,52.65c-4.58,11.6-17.69,17.29-29.29,12.71-11.6-4.58-17.29-17.69-12.71-29.29,4.58-11.6,17.69-17.29,29.29-12.71,11.6,4.58,17.29,17.69,12.71,29.29Z"/><g class="bone"><circle cx="25.04" cy="112.12" r="25.03"/><circle cx="130.81" cy="112.12" r="25.03"/><path d="m41.73,130.76s13.35-13.93,36.19-13.93,36.18,13.93,36.18,13.93v-37.29s-14.42,14.29-36.18,14.29c-22.83,0-36.19-14.3-36.19-14.3v37.3Z"/></g></svg>
        <h1>Squizzotti's Diet</h1>
      </div>
    </div>
  </div>
</header>

<section class="wrap login" id="login" hidden>
  <form class="card login-card" id="login-form" autocomplete="on">
    <h3>Accedi</h3>
    <p class="meta">Solo per Matteo e Anna. Usa l'email e la password del vostro account.</p>
    <label class="field"><span>Email</span><input type="email" id="login-email" name="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input type="password" id="login-pw" name="password" autocomplete="current-password" required></label>
    <p class="warnline" id="login-err" hidden></p>
    <button class="btn" type="submit" id="login-btn">Entra</button>
  </form>
</section>

<div class="wrap app" id="app" hidden>
  <div class="weekbar">
    <div class="weeknav">
      <button class="iconbtn" data-act="week-prev" aria-label="Settimana precedente">‹</button>
      <div class="weeklabel" id="weeklabel"></div>
      <button class="iconbtn" data-act="week-next" aria-label="Settimana successiva">›</button>
    </div>
    <span class="status" id="status" hidden><i></i><span></span></span>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Scelta del pasto"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
